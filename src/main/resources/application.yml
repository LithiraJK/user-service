# =====================================================
# user-service — Local Bootstrap Configuration
#
# This file contains ONLY the minimum config needed
# to locate the config-server. All other properties
# (DB URL, JWT secret, port, etc.) are loaded from:
#   config-server → classpath:/configs/user-service.yml
# =====================================================

spring:
  application:
    name: user-service

  config:
    # "optional:" allows the service to start even if config-server
    # is temporarily unavailable (falls back to local defaults).
    # Remove "optional:" in production to enforce strict config dependency.
    import: optional:configserver:http://localhost:8888

gcp:
  storage:
    bucket-name: ${GCP_BUCKET_NAME:tripvisito-trip-images}
    project-id: ${GCP_PROJECT_ID:your-gcp-project-id}
    credentials-path: ${GCP_CREDENTIALS_PATH:}